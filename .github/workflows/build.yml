name: 构建 Mac + Windows 版本

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 构建 macOS .app
        run: |
          pyinstaller \
            --name="简历评估" \
            --onedir \
            --windowed \
            --add-data="config.yaml:." \
            --add-data="prompts:prompts" \
            --add-data="rules:rules" \
            --hidden-import=watchdog.observers.polling \
            --exclude-module=tkinter \
            --exclude-module=numpy \
            --exclude-module=pandas \
            --clean \
            main.py

      - name: 打包发布文件 (macOS .app)
        run: |
          mkdir -p release
          cp -R dist/简历评估.app release/
          cp README_USER.md release/
          # 创建启动器
          cat > "release/启动系统.command" << 'LAUNCHER'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          open "$DIR/简历评估.app"
          LAUNCHER
          chmod +x "release/启动系统.command"
          # 用 ditto 打包（保留 .app 结构 + 中文文件名）
          ditto -c -k --keepParent release 简历评估系统-macOS.zip
          mv 简历评估系统-macOS.zip release/

      - name: 上传 macOS 版本
        uses: actions/upload-artifact@v4
        with:
          name: 简历评估系统-macOS
          path: release/简历评估系统-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 构建 Windows .exe
        run: |
          pyinstaller --name="简历评估" --onedir --windowed --add-data="config.yaml;." --add-data="prompts;prompts" --add-data="rules;rules" --hidden-import=watchdog.observers.polling --exclude-module=tkinter --exclude-module=numpy --exclude-module=pandas --clean main.py

      - name: 打包发布文件
        run: |
          mkdir -p release\简历评估系统
          xcopy /e /i /q dist\简历评估 release\简历评估系统\简历评估
          copy README_USER.md release\简历评估系统\
          copy install.bat release\简历评估系统\

      - name: 上传 Windows 版本
        uses: actions/upload-artifact@v4
        with:
          name: 简历评估系统-Windows
          path: release/简历评估系统/
